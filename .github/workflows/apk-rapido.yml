name: APK rapido
run-name: APK rapido ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-rapido-${{ github.ref }}
  cancel-in-progress: true

env:
  VENTOY_VERSION: '1.1.18'
  JAVA_TOOL_OPTIONS: -Xmx4g

jobs:
  apk:
    name: Gerar APK otimizado
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Preparar bibliotecas nativas
        run: |
          python3 scripts/native/install_sdk.py 'ndk;28.2.13676358' 'cmake;3.22.1'
          python3 scripts/native/prepare.py --sdk-root "$ANDROID_HOME"

      - name: Baixar payload do Ventoy
        run: |
          mkdir -p .vendroid-cache
          curl --fail --location --retry 5 --retry-all-errors \
            --output ".vendroid-cache/ventoy-${VENTOY_VERSION}-linux.tar.gz" \
            "https://github.com/ventoy/Ventoy/releases/download/v${VENTOY_VERSION}/ventoy-${VENTOY_VERSION}-linux.tar.gz"

      - name: Gerar APK
        run: ./gradlew assembleFossOptimized

      - name: Publicar APK
        uses: actions/upload-artifact@v5
        with:
          name: vendroid-apk-rapido
          path: app/build/outputs/apk/foss/optimized/app-foss-optimized.apk
          if-no-files-found: error
          retention-days: 7
